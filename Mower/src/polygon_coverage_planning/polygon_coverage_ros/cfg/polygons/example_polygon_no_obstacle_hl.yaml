# A polygon_coverage_msgs/PolygonWithHoles.msg to describe a forest.
# The planner always picks the largest z as the fixed altitude it plans in.
polygon:
  header:
    seq: 0
    stamp:
      secs: 0
      nsecs: 0
    frame_id: 'world'
  polygon:
    hull:
      points:
      - {x: 0.0, y: 0.0, z: 1.0}
      - {x: 8.30, y: 9.63, z: 1.0}
      - {x: 3.15, y: 22.51, z: 1.0}
      - {x: -11.0, y: 20.92, z: 1.0}
      - {x: -13.08, y: 8.28, z: 1.0}


