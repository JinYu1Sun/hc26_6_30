# A polygon_coverage_msgs/PolygonWithHoles.msg to describe a forest.
# The planner always picks the largest z as the fixed altitude it plans in.
polygon:
  header:
    seq: 0
    stamp:
      secs: 0
      nsecs: 0
    frame_id: 'world'
  polygon:
    hull:
      points:
      - {x: 0.0, y: 0.0, z: 1.0}
      - {x: 30.0, y: 0.0, z: 1.0}
      - {x: 30.0, y: 10.0, z: 1.0}
      - {x: 0.0, y: 10.0, z: 1.0}
    holes:
    - points:
      - {x: 0.10, y: 0.20, z: 0.5}
      - {x: 5.10, y: 0.20, z: 0.5}
      - {x: 5.10, y: 8.20, z: 0.5}
      - {x: 0.10, y: 8.20, z: 0.5}
  polygon:
    hull:
      points:
      - {x: 40.5, y: 5.5, z: 1.0}
      - {x: 60.0, y: 5.5, z: 1.0}
      - {x: 60.0, y: 15.0, z: 1.0}
      - {x: 40.5, y: 15.0, z: 1.0}



