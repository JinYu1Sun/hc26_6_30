common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"
    imu_acc_scale: 9.81          # MID360 acceleration is in g; convert internally to m/s^2
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: -0.003066 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    # FAST-LIO only accepts initialization after one uninterrupted stationary
    # window. Any instantaneous violation, timestamp reversal, or IMU gap resets
    # the full 2 s timer; a statistically bad completed window is also rejected.
    imu_init_static_duration: 2.0       # s, continuous confirmation time
    # The manager keeps the vehicle stop request latched until localization is
    # ready. These are deliberately loose sanity limits for obvious motion,
    # with margin over stationary chassis vibration; they must not become a
    # second, noise-sensitive interlock that can block startup indefinitely.
    imu_init_max_gyro_mean_norm: 0.08   # rad/s, norm of complete-window mean
    imu_init_max_gyro_norm: 0.20        # rad/s, norm of every sample
    imu_init_min_acc_norm: 8.0          # m/s^2, norm of every sample
    imu_init_max_acc_norm: 11.5         # m/s^2, norm of every sample
    # 0 disables the hardware-dependent acceleration-variance hard gate. The
    # variance is still published for diagnostics.
    imu_init_max_acc_variance: 0.0      # >0 enables per-axis population-variance gate
    imu_init_max_sample_gap: 0.10       # s, larger gaps break continuity
    imu_init_min_samples: 50            # protects against sparse/fake timestamps
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]
    # extrinsic_T: [ -0.006769, -0.020180,  0.037570]
    # extrinsic_R: [ 0.999996,  0.002177,  0.001933,
    #               -0.002171,  0.999993, -0.003154,
    #               -0.001940,  0.003150,  0.999993]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: false       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame
    # FAST-LIO内部地图和原始里程计仍保持在W系；另外发布
    # /Mower/lio_slam_level，表达在每代进程的重力水平局部系H。
    # R_H_W只在FAST-LIO IMU初始化后计算一次并冻结，禁止逐帧更新。
    lio_gravity_level_en: true
    # 实测日志：同时记录原W系/重力水平H系位姿、位移、重力、偏置和残差。
    lio_diagnostic_log_en: true
    lio_diagnostic_log_period_sec: 1.00 # 1Hz；减少rosout/磁盘I/O，细查时再临时调高

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
